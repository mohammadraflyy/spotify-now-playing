name: build

# Setiap push dan PR: unit test + build installer (artifact).
# Push tag vX.Y.Z: sekaligus membuat GitHub Release dari installer hasil build ini.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path "spotify_now_playing\__init__.py" -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} tidak sama dengan __version__ $version" }
          if (-not (Test-Path "docs\release-notes\v$version.md")) { throw "docs\release-notes\v$version.md belum dibuat" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # build.ps1 juga menjalankan unit test sebelum build
      - name: Build exe and installer
        shell: pwsh
        run: ./build.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyNowPlaying-Setup
          path: dist/SpotifyNowPlaying-Setup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SpotifyNowPlaying-Setup
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          file=$(ls dist/SpotifyNowPlaying-Setup-*.exe)
          {
            cat "docs/release-notes/${TAG}.md"
            echo
            echo "SHA-256: \`$(sha256sum "$file" | cut -d' ' -f1)\`"
            echo
            echo "Dibuild otomatis oleh GitHub Actions dari tag ini."
          } > notes.md
          gh release create "$TAG" "$file" --title "$TAG" --notes-file notes.md --latest
