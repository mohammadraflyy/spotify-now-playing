<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Lyrics</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Default dari halaman pengaturan; bisa ditimpa lewat URL:
     ?style=list|single  ?size=34  ?align=left|center|right
     ?bg=cover|color|dark|none  ?color=535353  ?offset=0.3 */
  @property --c1 { syntax: "<color>"; inherits: true; initial-value: #535353; }
  @property --c2 { syntax: "<color>"; inherits: true; initial-value: #2a2a2a; }
  :root {
    --size: 34px;
    --cur: #fff;                      /* baris yang sedang dinyanyikan */
    --past: rgba(255,255,255,.62);    /* baris yang sudah lewat */
    --next: rgba(0,0,0,.72);          /* baris berikutnya (ala Spotify) */
    transition: --c1 1.2s ease, --c2 1.2s ease;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: Inter, "Spotify Circular", "Segoe UI", sans-serif; }

  .stage { position: relative; height: 100vh; overflow: hidden; border-radius: 16px; transition: opacity .5s; }
  .hidden .stage { opacity: 0; }
  /* latar warna lagu: solid di atas, menggelap ke bawah */
  .bg-cover .stage, .bg-color .stage { background: linear-gradient(180deg,
      var(--c1) 0%, var(--c1) 35%,
      color-mix(in srgb, var(--c1) 78%, var(--c2)) 58%,
      color-mix(in srgb, var(--c1) 38%, var(--c2)) 80%,
      var(--c2) 100%); }
  .bg-dark .stage { background: linear-gradient(180deg, #2e2e2e 0%, #222 30%, #0a0a0a 100%); }
  .bg-dark, .bg-none { --next: rgba(255,255,255,.38); --past: rgba(255,255,255,.62); }
  .bg-none .line { text-shadow: 0 2px 10px rgba(0,0,0,.65); }

  .viewport { position: absolute; inset: 0;
    -webkit-mask-image: linear-gradient(transparent 0, #000 18%, #000 82%, transparent 100%);
            mask-image: linear-gradient(transparent 0, #000 18%, #000 82%, transparent 100%); }
  .single .viewport { -webkit-mask-image: none; mask-image: none; }

  .list { position: absolute; left: 0; right: 0; top: 0; padding: 0 28px;
    transition: transform .5s cubic-bezier(.3,.7,.2,1); will-change: transform; }
  .line { font-size: var(--size); font-weight: 800; line-height: 1.28; letter-spacing: -.01em;
    padding: calc(var(--size) * .2) 0; color: var(--next); transition: color .35s ease; }
  .line.empty::before { content: "♪"; }
  .line.past { color: var(--past); }
  .line.cur { color: var(--cur); }

  .single .line:not(.cur) { display: none; }
  .single .list { top: 50% !important; }
</style>
</head>
<body>
<div class="stage"><div class="viewport"><div class="list" id="list"></div></div></div>
<img id="cover" hidden alt="">

<script>
  const q = new URLSearchParams(location.search);
  const list = document.getElementById("list");
  const coverImg = document.getElementById("cover");
  const root = document.documentElement;
  let opts = {};
  let lyricsKey = null, lines = [], curIdx = -2, coverVersion = -1;
  let pos = 0, playing = false, stamp = performance.now(), active = false;

  // ---------------------------------------------------------- warna lagu --

  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
    if (max === min) return [0, 0, l];
    const d = max - min, s = l > .5 ? d / (2 - max - min) : d / (max + min);
    const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  }
  const hsl = (h, s, l) => `hsl(${h.toFixed(0)} ${(s * 100).toFixed(0)}% ${(l * 100).toFixed(0)}%)`;

  /** Warna dominan yang "berwarna" dari cover, disesuaikan supaya teks putih & gelap sama-sama terbaca. */
  function dominantColor(img) {
    const c = document.createElement("canvas");
    c.width = c.height = 40;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, 40, 40);
    const px = ctx.getImageData(0, 0, 40, 40).data;
    const buckets = new Map();
    let all = [0, 0, 0, 0];
    for (let i = 0; i < px.length; i += 4) {
      const [h, s, l] = rgbToHsl(px[i], px[i + 1], px[i + 2]);
      all[0] += px[i]; all[1] += px[i + 1]; all[2] += px[i + 2]; all[3]++;
      if (l < .12 || l > .9 || s < .18) continue;       // abaikan hitam/putih/abu
      const key = Math.round(h / 24);                     // 15 kelompok hue
      const b = buckets.get(key) || { w: 0, h: 0, s: 0, l: 0 };
      const w = s * (1 - Math.abs(l - .5));               // utamakan warna kuat & mid-tone
      b.w += w; b.h += h * w; b.s += s * w; b.l += l * w;
      buckets.set(key, b);
    }
    let best = null;
    for (const b of buckets.values()) if (!best || b.w > best.w) best = b;
    let h, s, l;
    if (best && best.w > 6) { h = best.h / best.w; s = best.s / best.w; l = best.l / best.w; }
    else { [h, s, l] = rgbToHsl(all[0] / all[3], all[1] / all[3], all[2] / all[3]); s = Math.min(s, .15); }
    s = s < .15 ? s : Math.min(.72, Math.max(.35, s));
    l = Math.min(.44, Math.max(.32, l));
    return [h, s, l];
  }

  function setBg(h, s, l) {
    root.style.setProperty("--c1", hsl(h, s, l));
    root.style.setProperty("--c2", hsl(h, s * .85, l * .2));  // hampir hitam, tetap bernuansa warna lagu
  }

  function hexToHsl(hex) {
    const n = parseInt(hex, 16);
    return rgbToHsl(n >> 16 & 255, n >> 8 & 255, n & 255);
  }

  coverImg.onload = () => { if (opts.bg === "cover") try { setBg(...dominantColor(coverImg)); } catch {} };
  coverImg.onerror = () => { if (opts.bg === "cover") setBg(0, 0, .33); };

  // -------------------------------------------------------------- opsi --

  function applyOpts(fromConfig) {
    const get = (k, d) => q.get(k) ?? fromConfig[k] ?? d;
    let bg = get("bg", "cover");
    if (bg === true || bg === "1") bg = "dark";           // format lama
    if (bg === false) bg = "cover";                        // format lama: checkbox tidak dicentang
    if (bg === "0" || bg === "") bg = "none";
    const prevBg = opts.bg, prevColor = opts.color;
    opts = {
      style: get("style", "list"),
      size: parseInt(get("size", 34)),
      align: get("align", "left"),
      bg,
      color: String(get("color", "535353")).replace("#", ""),
      offset: parseFloat(get("offset", 0)) || 0,
    };
    root.style.setProperty("--size", opts.size + "px");
    list.style.textAlign = opts.align;
    document.body.className = `bg-${opts.bg}` + (opts.style === "single" ? " single" : "");
    if (opts.bg === "color" && (prevBg !== "color" || prevColor !== opts.color)) setBg(...hexToHsl(opts.color));
    if (opts.bg === "cover" && prevBg !== "cover" && coverImg.complete && coverImg.naturalWidth) coverImg.onload();
    curIdx = -2;
  }

  async function loadConfig() {
    try { applyOpts((await (await fetch("/api/config", { cache: "no-store" })).json()).lyrics || {}); }
    catch {}
  }

  // ------------------------------------------------------------- lirik --

  function build() {
    list.innerHTML = "";
    for (const l of lines) {
      const div = document.createElement("div");
      div.className = "line" + (l.text ? "" : " empty");
      div.textContent = l.text;
      list.appendChild(div);
    }
    curIdx = -2;
  }

  async function pollLyrics() {
    try {
      const l = await (await fetch("/api/lyrics", { cache: "no-store" })).json();
      const key = l.key + "|" + l.status;
      if (key !== lyricsKey) {
        lyricsKey = key;
        lines = l.status === "synced" ? l.lines : [];
        build();
      }
    } catch {}
  }

  async function pollNow() {
    try {
      const s = await (await fetch("/api/now", { cache: "no-store" })).json();
      pos = s.position; playing = s.playing; active = s.active; stamp = performance.now();
      if (s.cover_version !== coverVersion) {
        coverVersion = s.cover_version;
        coverImg.src = "/cover?v=" + coverVersion;
      }
    } catch { active = false; }
  }

  function frame() {
    const t = pos + (playing ? (performance.now() - stamp) / 1000 : 0) + opts.offset;
    let idx = -1;
    for (let i = 0; i < lines.length && lines[i].t <= t; i++) idx = i;

    document.body.classList.toggle("hidden", !active || !lines.length);

    if (idx !== curIdx) {
      const els = list.children;
      for (let i = 0; i < els.length; i++) {
        els[i].classList.toggle("cur", i === idx);
        els[i].classList.toggle("past", i < idx);
      }
      curIdx = idx;
      // baris aktif di tengah (atau baris pertama sebelum lirik mulai)
      const target = els[Math.max(idx, 0)];
      if (target) {
        const center = target.offsetTop + target.offsetHeight / 2;
        const y = opts.style === "single" ? -center : window.innerHeight / 2 - center;
        list.style.transform = `translateY(${y}px)`;
      }
    }
    requestAnimationFrame(frame);
  }

  applyOpts({});
  loadConfig();
  setInterval(loadConfig, 3000);   // ikut perubahan dari halaman pengaturan
  setInterval(pollNow, 500);
  setInterval(pollLyrics, 1000);
  pollNow(); pollLyrics();
  window.addEventListener("resize", () => curIdx = -2);
  requestAnimationFrame(frame);
</script>
</body>
</html>
