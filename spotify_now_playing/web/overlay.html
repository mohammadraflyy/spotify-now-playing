<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Now Playing</title>
<link href="/static/fonts.css" rel="stylesheet">
<link rel="icon" href="/favicon.ico">
<style>
  /* Default dari halaman pengaturan; bisa ditimpa lewat URL:
     ?width=460 ?height=112 ?radius=16 ?bg=dark|cover|color|none ?color=282828 ?opacity=82
     ?accent=1db954 ?hidePaused=1 ?noProgress=1 ?show=always|change ?showFor=8
     ?layout=row|vertical|minimal|vinyl
     ?preset=nama  -> pakai preset dari halaman pengaturan */
  @property --c1 { syntax: "<color>"; inherits: true; initial-value: rgba(18,18,18,.82); }
  @property --c2 { syntax: "<color>"; inherits: true; initial-value: rgba(18,18,18,.82); }
  :root {
    --w: 460px; --h: 112px; --r: 16px;
    --accent: #1db954; --fg: #fff; --muted: rgba(255,255,255,.72);
    transition: --c1 1.2s ease, --c2 1.2s ease;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: Inter, "Segoe UI", sans-serif; }
  body { padding: 10px; }

  .card {
    display: flex; align-items: center; box-sizing: border-box;
    width: var(--w); height: var(--h);
    padding: calc(var(--h) * .11); gap: calc(var(--h) * .13);
    border-radius: var(--r); color: var(--fg);
    background: linear-gradient(120deg, var(--c1), var(--c2));
    box-shadow: 0 8px 28px rgba(0,0,0,.4);
    transform: translateX(-120%); opacity: 0;
    transition: transform .6s cubic-bezier(.2,.9,.3,1.2), opacity .4s;
  }
  .card.show { transform: translateX(0); opacity: 1; }
  .bg-none .card { box-shadow: none; }
  .bg-none .info { text-shadow: 0 2px 8px rgba(0,0,0,.7); }

  .cover-wrap { position: relative; flex: 0 0 auto; height: 100%; aspect-ratio: 1; }
  .cover { width: 100%; height: 100%; border-radius: min(calc(var(--r) * .65), 12px); object-fit: cover;
    background: rgba(255,255,255,.08); display: block; }
  .no-cover .cover-wrap { display: none; }
  .eq { position: absolute; right: 6%; bottom: 6%; display: flex; gap: 2px; align-items: flex-end; height: 16%; }
  .eq span { width: 3px; background: var(--accent); border-radius: 1px; animation: eq 1s infinite ease-in-out; }
  .eq span:nth-child(2) { animation-delay: -.4s; }
  .eq span:nth-child(3) { animation-delay: -.7s; }
  .paused .eq span { animation-play-state: paused; }
  @keyframes eq { 0%,100% { height: 20% } 50% { height: 100% } }

  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .label { font-size: calc(var(--h) * .095); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .marquee { overflow: hidden; white-space: nowrap; }
  .marquee > span { display: inline-block; }
  .marquee.scroll > span { animation: scroll var(--dur, 10s) linear infinite; padding-right: 48px; }
  @keyframes scroll { 0%, 15% { transform: translateX(0) } 100% { transform: translateX(var(--dist)) } }
  .title  { font-size: calc(var(--h) * .18); font-weight: 800; line-height: 1.2; margin: calc(var(--h) * .015) 0; }
  .artist { font-size: calc(var(--h) * .135); color: var(--muted); line-height: 1.25; }

  .progress { display: flex; align-items: center; gap: 8px; margin-top: calc(var(--h) * .07);
    font-size: calc(var(--h) * .095); color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: max(3px, calc(var(--h) * .035)); border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .5s linear; }
  .no-progress .progress, .card.no-dur .progress { display: none; }  /* no-dur: player tanpa durasi (mis. browser) */
  .eq.mini { display: none; position: static; height: .7em; align-self: center; }

  /* layout vertikal: cover besar di atas, ukuran mengikuti lebar */
  .layout-vertical .card { flex-direction: column; align-items: stretch; height: calc(var(--w) * 1.4);
    padding: calc(var(--w) * .06); gap: calc(var(--w) * .045); }
  .layout-vertical .cover-wrap { width: 100%; height: auto; }
  .layout-vertical .info { flex: 1; justify-content: flex-start; }
  .layout-vertical .eq { height: 8%; right: 4%; bottom: 4%; }
  .layout-vertical .label { font-size: calc(var(--w) * .036); }
  .layout-vertical .title { font-size: calc(var(--w) * .072); }
  .layout-vertical .artist { font-size: calc(var(--w) * .052); }
  .layout-vertical .progress { font-size: calc(var(--w) * .036); margin-top: calc(var(--w) * .03); }
  .layout-vertical .bar { height: max(3px, calc(var(--w) * .012)); }

  /* layout minimal: satu baris teks "Judul — Artis" */
  .layout-minimal .card { padding: 0 calc(var(--h) * .3); gap: calc(var(--h) * .2); }
  .layout-minimal .cover-wrap, .layout-minimal .label, .layout-minimal .progress { display: none; }
  .layout-minimal .info { flex-direction: row; align-items: center; justify-content: flex-start; gap: calc(var(--h) * .15); }
  .layout-minimal .eq.mini { display: flex; flex: 0 0 auto; height: calc(var(--h) * .28); }
  .layout-minimal .title { font-size: calc(var(--h) * .32); flex: 0 1 auto; min-width: 0; margin: 0; }
  .layout-minimal .artist { font-size: calc(var(--h) * .27); flex: 0 1 auto; min-width: 0; }
  .layout-minimal .artist::before { content: "— "; }
  .layout-minimal .artist > span { padding-left: 0; }

  /* layout vinyl: cover bulat yang berputar selama lagu diputar */
  .layout-vinyl .cover { border-radius: 50%; animation: spin 7s linear infinite;
    box-shadow: 0 0 0 calc(var(--h) * .03) #111, 0 4px 14px rgba(0,0,0,.5); }
  .layout-vinyl .paused .cover { animation-play-state: paused; }
  .layout-vinyl .cover-wrap::after { content: ""; position: absolute; inset: 41%; border-radius: 50%;
    background: #111; box-shadow: 0 0 0 2px rgba(255,255,255,.18); }
  .layout-vinyl .cover-wrap .eq { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* iklan Spotify: hanya teks "Jeda sebentar", tanpa progress dan animasi */
  .card.ad .progress, .card.ad .eq, .card.ad .label, .card.ad .artist { display: none; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="cover-wrap">
    <img class="cover" id="cover" alt="">
    <div class="eq"><span></span><span></span><span></span></div>
  </div>
  <div class="info">
    <div class="eq mini"><span></span><span></span><span></span></div>
    <div class="label" id="label">Now Playing</div>
    <div class="marquee title"><span id="title"></span></div>
    <div class="marquee artist"><span id="artist"></span></div>
    <div class="progress">
      <span id="pos">0:00</span><div class="bar"><div id="fill"></div></div><span id="dur">0:00</span>
    </div>
  </div>
</div>
<script src="/static/color.js"></script>

<script>
  const q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const card = $("card");
  const preset = q.get("preset");
  const isPreview = q.has("preview");          // preview di halaman pengaturan: selalu tampil
  let opts = {}, coverHsl = null;
  let coverVersion = -1, lastTitle = null, lastLayout = "";
  let lastTrack = null, wasPlaying = false, shownUntil = 0;

  // cover selama iklan: ikon jeda (Lucide "pause") di latar gelap
  const AD_COVER = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#282828"/><g transform="translate(20 20)" fill="none" stroke="#b3b3b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></g></svg>');
  const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const num = (v, d, min, max) => { v = parseFloat(v); return isNaN(v) ? d : Math.min(max, Math.max(min, v)); };
  const flag = v => v === true || v === "1" || v === "true";

  // ------------------------------------------------------------- opsi --

  function applyOpts(c) {
    const get = (k, d) => q.get(k) ?? c[k] ?? d;
    opts = {
      width: num(get("width", 460), 460, 200, 1200),
      height: num(get("height", 112), 112, 48, 400),
      radius: num(get("radius", 16), 16, 0, 60),
      bg: get("bg", "dark"),
      color: String(get("color", "282828")).replace("#", ""),
      opacity: num(get("opacity", 82), 82, 0, 100) / 100,
      accent: String(get("accent", "1db954")).replace("#", ""),
      hidePaused: flag(get("hidePaused", false)),
      noProgress: flag(get("noProgress", false)),
      noCover: flag(get("noCover", false)),
      layout: ["row", "vertical", "minimal", "vinyl"].includes(get("layout", "row")) ? get("layout", "row") : "row",
      show: get("show", "always"),
      showFor: num(get("showFor", 8), 8, 2, 120),
    };
    root.style.setProperty("--w", opts.width + "px");
    root.style.setProperty("--h", opts.height + "px");
    root.style.setProperty("--r", opts.radius + "px");
    root.style.setProperty("--accent", "#" + opts.accent);
    document.body.className = [
      "bg-" + opts.bg,
      "layout-" + opts.layout,
      opts.noProgress ? "no-progress" : "",
      opts.noCover ? "no-cover" : "",
    ].join(" ");
    applyBg();
    const layout = `${opts.width}x${opts.height}x${opts.layout}`;
    if (layout !== lastLayout) { lastLayout = layout; lastTitle = null; } // hitung ulang marquee
  }

  function applyBg() {
    const a = opts.opacity;
    let c1, c2;
    if (opts.bg === "none") {
      c1 = c2 = "rgba(0,0,0,0)";
    } else if (opts.bg === "cover" && coverHsl) {
      const [h, s, l] = coverHsl;
      c1 = SNPColor.hsl(h, s, l, a);
      c2 = SNPColor.hsl(h, s * .85, l * .45, a);        // menggelap ke kanan, seperti Spotify
    } else if (opts.bg === "color") {
      const [h, s, l] = SNPColor.hexToHsl(opts.color);
      c1 = SNPColor.hsl(h, s, l, a);
      c2 = SNPColor.hsl(h, s, l * .7, a);
    } else {                                             // dark (atau cover yang belum siap)
      c1 = `rgba(24,24,24,${a})`;
      c2 = `rgba(12,12,12,${a})`;
    }
    root.style.setProperty("--c1", c1);
    root.style.setProperty("--c2", c2);
  }

  async function loadConfig() {
    try {
      const c = await (await fetch("/api/config", { cache: "no-store" })).json();
      applyOpts((preset && c.presets?.[preset]) || c.overlay || {});
    }
    catch {}
  }

  // ------------------------------------------------------------- lagu --

  function setMarquee(el, text) {
    el.textContent = text;
    const box = el.parentElement;
    box.classList.remove("scroll");
    requestAnimationFrame(() => {
      if (el.scrollWidth - box.clientWidth > 0) {
        const dist = el.scrollWidth + 48;
        box.style.setProperty("--dist", `-${dist}px`);
        box.style.setProperty("--dur", `${dist / 40}s`);
        box.classList.add("scroll");
      }
    });
  }

  async function poll() {
    try {
      const s = await (await fetch("/api/now", { cache: "no-store" })).json();
      // mode "change": muncul beberapa detik saat lagu berganti atau mulai diputar lagi
      const key = s.title + "|" + s.artist;
      const now = Date.now();
      if (s.active && (key !== lastTrack || (s.playing && !wasPlaying))) shownUntil = now + opts.showFor * 1000;
      lastTrack = s.active ? key : null;
      wasPlaying = s.active && s.playing;
      let visible = s.active && (s.playing || !opts.hidePaused);
      if (opts.show === "change" && !isPreview) visible = visible && now < shownUntil;
      card.classList.toggle("show", visible);
      card.classList.toggle("paused", !s.playing);
      card.classList.toggle("no-dur", !s.duration);
      card.classList.toggle("ad", !!s.ad);
      $("label").textContent = s.ad ? "" : s.playing ? "Now Playing" : "Paused";

      if (key !== lastTitle) {
        lastTitle = key;
        setMarquee($("title"), s.title);
        setMarquee($("artist"), s.artist);
      }
      if (s.ad) {
        if (coverVersion !== "ad") { coverVersion = "ad"; $("cover").src = AD_COVER; }
      } else if (s.cover_version !== coverVersion) {
        coverVersion = s.cover_version;
        $("cover").src = "/cover?v=" + coverVersion;
      }
      $("pos").textContent = fmt(s.position);
      $("dur").textContent = fmt(s.duration);
      $("fill").style.width = s.duration ? Math.min(100, s.position / s.duration * 100) + "%" : "0";
    } catch {
      card.classList.remove("show"); // aplikasi mati
    }
  }

  $("cover").onload = function () {
    try { coverHsl = SNPColor.dominant(this); } catch { coverHsl = null; }
    applyBg();
  };
  $("cover").onerror = function () { this.removeAttribute("src"); coverHsl = null; applyBg(); };

  applyOpts({});
  loadConfig();
  setInterval(loadConfig, 3000);   // ikut perubahan dari halaman pengaturan
  setInterval(poll, 500);
  poll();
</script>
</body>
</html>
